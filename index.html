/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

html,body{background:#e8e3d8;overflow:hidden}
#app{position:absolute!important;inset:auto!important;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;color:#2b2620;font-family:'JetBrains Mono',ui-monospace,monospace}
#gl{position:absolute;left:0;top:0;width:1600px;height:900px;touch-action:none;cursor:grab}
.ui{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none}
.ui button,.ui input,.ui .pn{pointer-events:auto}
.pn{position:absolute;background:rgba(243,238,227,.93);border:1px solid rgba(110,98,78,.45);padding:10px 12px;box-sizing:border-box}
.pn h3{margin:0 0 6px;font:700 9px 'JetBrains Mono';letter-spacing:2px;color:#3a342b}
.pn h3 b{color:#d0592a}
.pn canvas{display:block}
.legend{display:flex;align-items:center;gap:10px;margin-top:3px;font:600 8px 'JetBrains Mono';letter-spacing:1.2px;color:#6f6556;white-space:nowrap}
.legend b{margin-left:auto;color:#2b2620;font-weight:700;font-size:9.5px;letter-spacing:.8px}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.ln{width:16px;height:0;border-top:2px solid #d0592a}.ln.d{border-top:2px dotted #2b2620}.ln.g{border-top:2px dashed #9c917d}
.bx{width:10px;height:8px;background:#2b2620}.bx.h{background:transparent;border:1px dashed #8a7f6c;box-sizing:border-box}.bx.s{background:#d0592a}

/* left column */

.t1{font:800 32px/1 Inter,sans-serif;letter-spacing:.5px}.t1 span{color:#d0592a}

.big{margin-top:2px;display:flex;align-items:baseline;gap:10px}

.lbl2{font:700 8.5px 'JetBrains Mono';letter-spacing:1.5px;color:#3a342b;margin-top:2px}
.ph{display:flex;justify-content:space-between;margin-top:4px;font:700 8.5px 'JetBrains Mono';letter-spacing:1.2px;color:#6f6556}
.ph #pname{color:#d0592a}
.pA{left:24px;top:188px;width:388px;height:150px}
.pB{left:24px;top:348px;width:388px;height:150px}
.pC{left:24px;top:508px;width:388px;height:150px}
.pD{left:24px;top:668px;width:388px;height:212px}
#cD{display:inline-block}#cD2{display:inline-block;vertical-align:top;margin-left:6px}

/* right column */
.pS{left:1188px;top:18px;width:388px;height:196px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sb{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border:1px solid rgba(110,98,78,.5);background:rgba(243,238,227,.92);color:#2b2620;font:700 9.5px 'JetBrains Mono';letter-spacing:1.3px;cursor:pointer}
.sb i{font-style:normal;font-size:8px;color:#d0592a;letter-spacing:1px}
.sb.on{background:#2b2620;color:#f3eee3;border-color:#2b2620}.sb.on i{color:#ffb27d}
.pV{left:1188px;top:224px;width:388px;height:96px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.b{height:30px;padding:0 8px;border:1px solid rgba(110,98,78,.5);background:rgba(243,238,227,.92);color:#2b2620;font:700 9px 'JetBrains Mono';letter-spacing:1.2px;cursor:pointer;white-space:nowrap}
.b:hover,.sb:hover{filter:brightness(.94)}
.b.on{background:#2b2620;color:#f3eee3;border-color:#2b2620}
.pM{left:1188px;top:330px;width:388px;height:336px}
.legpick{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-bottom:5px}
.lp{height:20px;border:1px solid rgba(110,98,78,.5);background:transparent;color:#2b2620;font:700 8.5px 'JetBrains Mono';cursor:pointer}
.lp.on{background:#d0592a;border-color:#d0592a;color:#fff}
.pP{left:1188px;top:676px;width:388px;height:204px}

/* centre bottom */
.pPh{left:430px;top:710px;width:740px;height:98px;padding:8px 12px}
.phrow{display:flex;align-items:center;gap:12px}
.lbl{font:700 9px 'JetBrains Mono';letter-spacing:1.6px;color:#6f6556;white-space:nowrap}.lbl b{color:#d0592a;margin-left:4px}

.ctl{display:flex;gap:6px;align-items:center}

.pCk{left:430px;top:814px;width:740px;height:66px;padding:8px 12px}

/* callouts */
.lead{position:absolute;left:0;top:0;pointer-events:none}
.lead polyline{fill:none;stroke:#2b2620;stroke-width:1;opacity:.75}
.lead circle{fill:#d0592a;stroke:#f3eee3;stroke-width:1}
#callouts{position:absolute;left:0;top:0;pointer-events:none}

.call span{display:block;font:700 8px 'JetBrains Mono';letter-spacing:1.4px;color:#6f6556}
.call b{display:block;margin-top:2px;font:700 11px 'JetBrains Mono';color:#2b2620;white-space:nowrap}

.sb.work{box-shadow:inset 4px 0 0 #d0592a}

.big{position:relative}.big canvas{position:absolute;right:0;top:2px;width:170px;height:56px}

.phid{position:absolute;left:672px;top:868px;width:256px;text-align:center;font:700 9px 'JetBrains Mono';letter-spacing:2px;color:#8a7f6c;opacity:0;transition:opacity .3s;pointer-events:none}
.pn,.hint,.chip,#callouts,.lead{transition:opacity .25s,visibility 0s}
.ui.hide .pn,.ui.hide .hint,.ui.hide .chip,.ui.hide #callouts,.ui.hide .lead{opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.ui.hide .phid{opacity:1}
#cur{position:absolute;left:0;top:0;pointer-events:none;opacity:0;z-index:20;will-change:transform;filter:drop-shadow(0 1px 1.5px rgba(40,30,15,.35))}
#fade{position:absolute;left:0;top:0;width:1600px;height:900px;background:#efe8d6;opacity:0;pointer-events:none;z-index:30;transition:opacity .35s}

#exs.press{outline:2px solid #d0592a}
#fade.warm{display:flex;align-items:center;justify-content:center;font:700 11px 'JetBrains Mono';letter-spacing:3px;color:#8a7f6c}
